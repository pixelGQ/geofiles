name: Update geo files

on:
  schedule:
    - cron: "0 */6 * * *"   # ad/RU lists move a few times a day; 6h is ample
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build slim geosite + fetch geoip
        run: python3 scripts/build_geo.py --config sources.json --out-geosite geosite.dat.new --out-geoip geoip.dat.new

      - name: Guard — fail if any profile category is missing/empty
        run: python3 scripts/check_geo.py geosite.dat.new geoip.dat.new

      # Second artifact for desktop/Android: same build, category-ads swapped for
      # Loyalsoldier category-ads-all (~189k domains). The backend hands this URL
      # only to platforms without the iOS NE memory ceiling (base64.py,
      # _FULL_ADS_PLATFORMS); iOS/Apple TV keep geosite.dat above.
      - name: Build full-ads geosite (desktop/Android)
        run: |
          python3 scripts/build_geo.py --config sources.json --profile full --out-geosite geosite-full.dat.new --out-geoip geoip.full.tmp
          rm -f geoip.full.tmp

      - name: Guard — full-ads geosite
        run: python3 scripts/check_geo.py --full geosite-full.dat.new geoip.dat.new

      - name: Detect changes
        id: check
        run: |
          changed=false
          for f in geoip.dat geosite.dat geosite-full.dat; do
            if [ ! -f "$f" ] || ! cmp -s "$f" "$f.new"; then changed=true; fi
          done
          echo "changed=$changed" >> "$GITHUB_OUTPUT"

      - name: Archive previous
        if: steps.check.outputs.changed == 'true'
        run: |
          d="archive/$(date -u +%Y-%m-%d)"
          mkdir -p "$d"
          # `[ -f ] && cp` as the loop's last command fails the step when the
          # last file does not exist yet (first run with geosite-full.dat).
          for f in geoip.dat geosite.dat geosite-full.dat; do
            if [ -f "$f" ]; then cp "$f" "$d/"; fi
          done

      - name: Promote
        if: steps.check.outputs.changed == 'true'
        run: |
          mv geoip.dat.new geoip.dat
          mv geosite.dat.new geosite.dat
          mv geosite-full.dat.new geosite-full.dat
          # Sidecars: INCY decides whether to re-download a geo file by fetching
          # <url>.sha256 and comparing; without them it kept an April build for
          # months (found 2026-09-05). Format is sha256sum's: "<hex>  <name>".
          sha256sum geoip.dat   > geoip.dat.sha256
          sha256sum geosite.dat > geosite.dat.sha256
          sha256sum geosite-full.dat > geosite-full.dat.sha256

      - name: Cleanup
        if: steps.check.outputs.changed != 'true'
        run: rm -f geoip.dat.new geosite.dat.new geosite-full.dat.new

      - name: Commit & push
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add geoip.dat geosite.dat geosite-full.dat geoip.dat.sha256 geosite.dat.sha256 geosite-full.dat.sha256 archive/
          git commit -m "geo: rebuild $(date -u +%Y-%m-%dT%H:%MZ)"
          git push

      - name: Purge jsDelivr cache
        if: steps.check.outputs.changed == 'true'
        # The subscription profile points at THIS repo's @master (see
        # backend/app/subscription/config/formats/strategies/base64.py), and
        # jsDelivr caches a branch ref for 12 h. Purging the org repo (as this
        # step did until 2026-09-05) cleared nothing anyone downloads.
        run: |
          for f in geoip.dat geosite.dat geosite-full.dat geoip.dat.sha256 geosite.dat.sha256 geosite-full.dat.sha256; do
            curl -s "https://purge.jsdelivr.net/gh/pixelGQ/geofiles@master/$f" >/dev/null
          done
